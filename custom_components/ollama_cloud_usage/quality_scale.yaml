  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: |
      ollama.com has no discovery mechanism. Accounts are added manually
      with an API key.
  discovery-update-info:
    status: exempt
    comment: |
      ollama.com has no discovery mechanism. Accounts are added manually
      with an API key.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: |
      This integration does not talk to a device. It talks to the ollama.com
      cloud API, which is documented in the README.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      Each configured account is one device, created with the config entry.
      There are no further devices that can appear.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: |
      Each configured account is one device, created and removed with the
      config entry.
  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
